// ===== 高密度绿色星空粒子（数量翻倍）=====
class StarGroup {
  constructor(count, size, baseOpacity, driftSpeed, selfRotateSpeed, blinkFreq) {
    this.count = count;
    this.driftSpeed = driftSpeed;
    this.selfRotateSpeed = selfRotateSpeed;
    this.blinkFreq = blinkFreq;
    this.baseOpacity = baseOpacity;

    this.geo = new THREE.BufferGeometry();
    this.posArr = new Float32Array(count * 3);
    this.curPos = new Float32Array(count * 3);
    this.phaseOffsets = new Float32Array(count);

    for(let i = 0; i < count * 3; i += 3) {
      const x = (Math.random() - 0.5) * 40;
      const y = (Math.random() - 0.5) * 40;
      const z = (Math.random() - 0.5) * 40;
      this.posArr[i] = x;
      this.posArr[i+1] = y;
      this.posArr[i+2] = z;
      this.curPos[i] = x;
      this.curPos[i+1] = y;
      this.curPos[i+2] = z;
    }
    for(let i = 0; i < count; i++){
      this.phaseOffsets[i] = Math.random() * Math.PI * 2;
    }

    this.geo.setAttribute('position', new THREE.BufferAttribute(this.posArr, 3));
    this.mat = new THREE.PointsMaterial({
      color: 0x39ff99,
      size: size,
      transparent: true,
      opacity: baseOpacity,
      sizeAttenuation: true,
      depthWrite: false
    });
    this.points = new THREE.Points(this.geo, this.mat);
    scene.add(this.points);
  }

  update(delta, time) {
    const posAttr = this.geo.attributes.position;
    const arr = this.posArr;
    const cur = this.curPos;

    for(let i = 0; i < this.count; i++){
      const idx = i * 3;
      let x = cur[idx];
      let y = cur[idx+1];
      let z = cur[idx+2];

      const rXZ = Math.sqrt(x*x + z*z);
      const ang = Math.atan2(z, x) + this.selfRotateSpeed * delta;
      x = Math.cos(ang) * rXZ;
      z = Math.sin(ang) * rXZ;

      const len = Math.sqrt(x*x + y*y + z*z);
      if(len > 0.01) {
        const f = this.driftSpeed * delta;
        x += (x / len) * f;
        y += (y / len) * f;
        z += (z / len) * f;
      }

      const curLen = Math.sqrt(x*x + y*y + z*z);
      if(curLen > 45) {
        cur[idx]   = (Math.random() - 0.5) * 40;
        cur[idx+1] = (Math.random() - 0.5) * 40;
        cur[idx+2] = (Math.random() - 0.5) * 40;
      } else {
        cur[idx]   = x;
        cur[idx+1] = y;
        cur[idx+2] = z;
      }

      arr[idx]   = cur[idx];
      arr[idx+1] = cur[idx+1];
      arr[idx+2] = cur[idx+2];
    }

    posAttr.needsUpdate = true;

    let s = 0;
    const freq = this.blinkFreq;
    for(let i = 0; i < this.count; i++){
      s += Math.sin(time * freq + this.phaseOffsets[i]);
    }
    this.mat.opacity = this.baseOpacity + (s / this.count) * 0.18;
  }
}

// 星空：原来500 → 1200

// ===== 高密度爱心粒子（数量加多）=====
class DiffuseHeart {
  constructor() {
    this.pts = [];
    this.initPoints();
  }

  heartFunc(t, shrink) {
    const x = 16 * Math.pow(Math.sin(t), 3) * shrink;
    const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * shrink;
    return {x, y};
  }

  scatterInside(x, y, beta = 0.1) {
    const rx = -beta * Math.log(Math.random());
    const ry = -beta * Math.log(Math.random());
    return {x: x - rx * x, y: y - ry * y};
  }

  initPoints() {
    const shrink = 0.10;
    // 爱心粒子增加
    for(let i = 0; i < 4500; i++) {
      const t = Math.random() * Math.PI * 2;
      const p = this.heartFunc(t, shrink);
      const np = this.scatterInside(p.x, p.y, 0.08);
      this.pts.push(np.x, np.y, (Math.random()-0.5)*0.25);
    }
    for(let i = 0; i < 5000; i++) {
      const t = Math.random() * Math.PI * 2;
      const p = this.heartFunc(t, shrink * 0.85);
      const np = this.scatterInside(p.x, p.y, 0.06);
      this.pts.push(np.x, np.y, (Math.random()-0.5)*0.25);
    }
  }
  getBuffer(){
    return new Float32Array(this.pts);
  }
}

const heartIns = new DiffuseHeart();

// ===== LXX 粒子文字 =====
const lxxGeometry = new THREE.BufferGeometry();
const lxxPositions = [];
const lxxMaterial = new THREE.PointsMaterial({
  color: 0x39ff99,
  size: 0.12,
  transparent: true,
  opacity: 1,
  sizeAttenuation: true,
  depthWrite: false,
  depthTest: false
});
function addLXX(px, py){
  const step = 0.32 * 0.8;
  const rows = 7;
  for(let r = 0; r < rows; r++){
    lxxPositions.push(px, py - r * step, 0);
    if(r === rows - 1){
      for(let c = 1; c < 4; c++){
        lxxPositions.push(px + c * step, py - r * step, 0);
      }
    }
    lxxPositions.push(px + 1.7 * 0.8 + r * step * 0.4, py - r * step, 0);
    lxxPositions.push(px + 1.7 * 0.8 - r * step * 0.4 + step * 2, py - r * step, 0);
    lxxPositions.push(px + 3.6 * 0.8 + r * step * 0.4, py - r * step, 0);
    lxxPositions.push(px + 3.6 * 0.8 - r * step * 0.4 + step * 2, py - r * step, 0);
  }
}
addLXX(-5.6, 1.0);
lxxGeometry.setAttribute('position', new THREE.Float32BufferAttribute(lxxPositions, 3));

});
function addXXL(px, py){
  const step = 0.32 * 0.8;
  const rows = 7;
  for(let r = 0; r < rows; r++){
    xxlPositions.push(px + r * step * 0.4, py - r * step, 0);
    xxlPositions.push(px - r * step * 0.4 + step * 2, py - r * step, 0);
    xxlPositions.push(px + 1.9 * 0.8 + r * step * 0.4, py - r * step, 0);
    xxlPositions.push(px + 1.9 * 0.8 - r * step * 0.4 + step * 2, py - r * step, 0);
    xxlPositions.push(px + 3.2 * 0.8, py - r * step, 0);
  }
  xxlPositions.push(px + 3.2 * 0.8, py - 6 * step, 0);
  xxlPositions.push(px + 3.4 * 0.8, py - 6 * step, 0);
  xxlPositions.push(px + 3.6 * 0.8, py - 6 * step, 0);
  xxlPositions.push(px + 3.8 * 0.8, py - 6 * step, 0);
  xxlPositions.push(px + 4.0 * 0.8, py - 6 * step, 0);
}
addXXL(2.6, 1.0);
xxlGeometry.setAttribute('position', new THREE.Float32BufferAttribute(xxlPositions, 3));

  "./img/p52.jpg"
];
const loader = new THREE.TextureLoader();
const total = imgList.length;

for(let i = 0; i < total; i++){
  const theta = Math.PI * (3 - Math.sqrt(5)) * i;
  const baseR = 10;
  const r = baseR * (0.92 + Math.random() * 0.08);
  const rawY = ((i / total) * 2 - 1) * 0.9;
  const y = rawY * (1 - 0.35) + (Math.random() - 0.5) * 0.18;
  const rr = Math.sqrt(1 - Math.pow(y / 0.9, 2) * 0.9);
  const x = Math.cos(theta) * rr * r;
  const z = Math.sin(theta) * rr * r;

  const geo = new THREE.PlaneGeometry(1.5, 1.5);
  const tex = loader.load(imgList[i]);
  tex.generateMipmaps = false;
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    side: THREE.DoubleSide,
    transparent: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  // 向外朝向，正面朝外
  const dir = new THREE.Vector3(x, y, z).normalize();
  mesh.lookAt(x + dir.x, y + dir.y, z + dir.z);
  photoGroup.add(mesh);
  meshArr.push(mesh);
}


// 切换播放/暂停，按钮符号 🎵 ⏸
musicBtn.onclick = async function () {
  if (!bgmPlayed) {
    await bgmAudio.play();
    bgmPlayed = true;
    musicBtn.innerText = "⏸";
  } else {
    if (!bgmAudio.paused) {
      bgmAudio.pause();
      musicBtn.innerText = "🎵";
    } else {
      bgmAudio.play();
      musicBtn.innerText = "⏸";
    }
  }
}

function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  starSlow.update(delta, time);
  starMid.update(delta, time);
  starFast.update(delta, time);

  photoGroup.rotation.y += 0.0008;

  const s = 1 + Math.sin(time * 2.2) * 0.07;
  heart.scale.set(s, s, s);

  controls.update();
  renderer.render(scene,camera);
}
animate();
